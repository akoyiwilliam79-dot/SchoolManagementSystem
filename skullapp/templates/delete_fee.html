{% extends 'base.html' %}

{% block content %}

<h1>Delete Fee</h1>

<p>Are you sure you want to delete this fee record?</p>

<p>
    <strong>Student:</strong> {{ fee.student.first_name }} {{ fee.student.last_name }}<br>
    <strong>Paid:</strong> {{ fee.amount_paid }}<br>
    <strong>Total:</strong> {{ fee.total_fee }}
</p>

<form method="POST">
    {% csrf_token %}
    <button type="submit" style="background:red; color:white;">
        Confirm Delete
    </button>
</form>

<br>

<a href="{% url 'fees' %}">
    <button>Cancel</button>
</a>
<br>
<br>
<a href="{% url 'fees' %}">
    <button>Back</button>
</a>

{% endblock %}
