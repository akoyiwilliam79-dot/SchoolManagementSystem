{% extends 'base.html' %}

{% block content %}

<h1>Delete Result</h1>

<p>Are you sure you want to delete this result?</p>

<strong>
    {{ result.student.first_name }} {{ result.student.last_name }}
</strong>

<p>Total Marks: {{ result.total }}</p>

<form method="POST">
    {% csrf_token %}
    <button style="background:red;">Yes Delete</button>
</form>

<br>

<a href="{% url 'results' %}">
    <button>No Cancel</button>
</a>

{% endblock %}
