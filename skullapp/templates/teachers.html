{% extends 'base.html' %}
{% load static %}
{% block content %}

<h1>Teachers & Staff</h1>

<table>
    <tr>
        <th>Name</th>
        <th>Subject 1</th>
        <th>Subject 2</th>
        <th>Subject 3</th>
        <th>Phone</th>
        <th>Actions</th>
    </tr>

    {% for teacher in teachers %}
    <tr>
        <td>{{ teacher.name }}</td>
        <td>{{ teacher.subject1 }}</td>
        <td>{{ teacher.subject2 }}</td>
        <td>{{ teacher.subject3 }}</td>
        <td>{{ teacher.phone }}</td>

        <td>
            <a href="{% url 'edit_teacher' teacher.id %}">
                <button>Edit</button>
            </a>

            <a href="{% url 'delete_teacher' teacher.id %}">
                <button style="background:red;">Delete</button>
            </a>
        </td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
