{% extends 'base.html' %}

{% block content %}

<h1>Add Teacher</h1>

<form method="POST">
    {% csrf_token %}

    <input type="text" name="name" placeholder="Name"><br><br>
    <input type="text" name="subject" placeholder="Subject"><br><br>
    <input type="text" name="phone" placeholder="Phone"><br><br>

    <button type="submit">Save Teacher</button>
</form>

{% endblock %}
