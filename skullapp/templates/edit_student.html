{% extends 'base.html' %}

{% block content %}

<h1>Edit Student</h1>

<form method="POST">
    {% csrf_token %}

    <label>First Name</label><br>
    <input type="text" name="first_name" value="{{ student.first_name }}"><br><br>

    <label>Last Name</label><br>
    <input type="text" name="last_name" value="{{ student.last_name }}"><br><br>

    <label>Admission Number</label><br>
    <input type="text" name="admission_number" value="{{ student.admission_number }}"><br><br>

    <label>Class</label><br>
    <input type="text" name="student_class" value="{{ student.student_class }}"><br><br>

    <button type="submit">Update</button>
</form>

{% endblock %}
