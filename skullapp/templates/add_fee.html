{% extends 'base.html' %}

{% block content %}

<h2>Add Fee Record</h2>

<form method="POST">
    {% csrf_token %}

    <div>
        <label>Student</label><br>
        <select name="student" required>
            <option value="">-- Select Student --</option>
            {% for student in students %}
                <option value="{{ student.id }}">
                    {{ student.first_name }} {{ student.last_name }}
                </option>
            {% endfor %}
        </select>
    </div>
    

    <br>

    <div>
        <label>Amount Paid</label><br>
        <input type="number" name="amount_paid" placeholder="Enter amount paid" required>
    </div>

    <br>

    <div>
        <label>Total Fee</label><br>
        <input type="number" name="total_fee" placeholder="Enter total fee" required>
    </div>

    <br>

    <button type="submit">Save Fee</button><br><br><button type="submit" style="background:red; color:white;">
        Delete Fee
    </button>
</form>

<br>
<a href="{% url 'fees' %}">
    <button>Back</button>
</a>

{% endblock %}
