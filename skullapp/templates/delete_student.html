{% extends 'base.html' %}

{% block content %}

<h1>Delete Student</h1>

<p>Are you sure you want to delete:</p>

<strong>{{ student.first_name }} {{ student.last_name }}</strong>

</form>

<a href="{% url 'students' %}">

</a>
<br>
<br>
<a href="{% url 'students' %}">
    <button>Back</button>
</a>


{% endblock %}
