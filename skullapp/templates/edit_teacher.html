{% extends 'base.html' %}

{% block content %}

<h1>Edit Teacher</h1>

<form method="POST">
    {% csrf_token %}

    <input type="text" name="name" value="{{ teacher.name }}"><br><br>
    <input type="text" name="subject" value="{{ teacher.subject }}"><br><br>
    <input type="text" name="phone" value="{{ teacher.phone }}"><br><br>

    <button type="submit">Update</button>
</form>

<br>
<a href="{% url 'teachers' %}">
    <button>Back</button>
</a>

{% endblock %}
