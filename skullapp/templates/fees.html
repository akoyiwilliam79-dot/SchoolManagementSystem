{% extends 'base.html' %}

{% block content %}

<h1>Fees Management</h1>

<a href="{% url 'add_fee' %}">
    <button>Add Fee</button>
</a>

<table>
    <tr>
        <th>Student</th>
        <th>Paid</th>
        <th>Total</th>
        <th>Balance</th>
        <th>Actions</th>
    </tr>

    {% for fee in fees %}
    <tr>
        <td>{{ fee.student.first_name }} {{ fee.student.last_name }}</td>
        <td>{{ fee.amount_paid }}</td>
        <td>{{ fee.total_fee }}</td>
        <td>{{ fee.balance }}</td>
        <td>
            <a href="{% url 'edit_fee' fee.id %}">
                <button>Edit</button>
            </a>

            <a href="{% url 'delete_fee' fee.id %}">
                <button style="background:red;">Delete</button>
            </a>
        </td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
