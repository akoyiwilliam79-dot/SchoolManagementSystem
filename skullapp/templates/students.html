<!-- students.html -->
{% extends 'base.html' %}
{% load static%}
{% block content %}
<h1>Students Management</h1>
<button>Add Student</button>
<table>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Class</th>
        <th>Actions</th>
    </tr>
   <tbody>
{% for student in students %}
<tr>
    <td>{{ student.admission_number }}</td>
    <td>{{ student.first_name }} {{ student.last_name }}</td>
    <td>{{ student.student_class }}</td>
    <td>Edit | Delete</td>
</tr>
{% endfor %}
</tbody>
</table>
{% endblock %}
