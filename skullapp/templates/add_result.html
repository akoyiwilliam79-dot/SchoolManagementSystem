{% extends 'base.html' %}

{% block content %}

<h1>Add Results</h1>

<form method="POST">
    {% csrf_token %}

    <select name="student">
        {% for student in students %}
            <option value="{{ student.id }}">
                {{ student.first_name }} {{ student.last_name }}
            </option>
        {% endfor %}
    </select><br><br>

    <input type="number" name="english" placeholder="English"><br><br>
    <input type="number" name="kiswahili"><br><br>
    <input type="number" name="maths"><br><br>
    <input type="number" name="science"><br><br>
    <input type="number" name="social_studies"><br><br>
    <input type="number" name="cre"><br><br>
    <input type="number" name="computer"><br><br>
    <input type="number" name="business"><br><br>
    <input type="number" name="agriculture"><br><br>

    <button type="submit">Save Result</button>
</form>

{% endblock %}
